<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#f2f4f7"/>

  <rect x="60" y="60" width="520" height="510" rx="24" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>

  <rect x="96" y="106" width="64" height="64" rx="16" fill="#2563eb"/>
  <text x="128" y="152" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="44" font-weight="700" fill="#ffffff" text-anchor="middle">%</text>

  <text x="96" y="230" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="40" font-weight="700" fill="#1a1a1a">Калькулятор НДС</text>
  <text x="96" y="270" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#6b7280">22%, 20%, 10%, 0%, 5%, 7%</text>

  <rect x="96" y="320" width="448" height="64" rx="12" fill="#f8f9fb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="116" y="360" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#374151">Цена с НДС</text>
  <text x="524" y="360" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#1a1a1a" text-anchor="end">1 220 ₽</text>

  <rect x="96" y="400" width="448" height="64" rx="12" fill="#f8f9fb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="116" y="440" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#374151">НДС (22%)</text>
  <text x="524" y="440" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#2563eb" text-anchor="end">220 ₽</text>

  <rect x="96" y="480" width="448" height="64" rx="12" fill="#f8f9fb" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="116" y="520" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="20" fill="#374151">Цена без НДС</text>
  <text x="524" y="520" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#1a1a1a" text-anchor="end">1 000 ₽</text>

  <text x="640" y="180" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700" fill="#1a1a1a">Быстрый онлайн-расчёт</text>
  <text x="640" y="228" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#374151">Введите любую сумму — остальные</text>
  <text x="640" y="258" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#374151">поля пересчитаются мгновенно</text>

  <text x="640" y="330" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#374151">Все ставки НДС, актуальные для России</text>
  <text x="640" y="360" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="22" fill="#374151">в 2026 году, включая режимы УСН</text>

  <text x="640" y="470" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#6b7280">Цена с НДС = Цена без НДС × (1 + ставка)</text>
  <text x="640" y="504" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#6b7280">НДС = Цена с НДС − Цена без НДС</text>

  <text x="640" y="580" font-family="-apple-system, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#2563eb">nds-nds.ru</text>
</svg>
